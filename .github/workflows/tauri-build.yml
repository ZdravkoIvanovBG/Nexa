name: Tauri Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform.name }} (${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: msi
          - name: Windows-ARM64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundle: msi
          - name: macOS-AppleSilicon
            runner: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg
          - name: macOS-Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundle: dmg
          - name: Linux-x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle: deb,appimage

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux deps
        if: contains(matrix.platform.runner, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libmpv-dev \
            libgtk-3-dev \
            patchelf

      - name: Install Mac deps
        if: contains(matrix.platform.runner, 'macos')
        run: |
          brew install mpv pkg-config
          # Make pkg-config find libmpv from homebrew
          echo "PKG_CONFIG_PATH=$(brew --prefix mpv)/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            harbor-core
            src-tauri

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      # ARM64 links against libmpv too, but the committed src-tauri/libmpv/mpv.lib
      # is x64-only. Set up the ARM64 MSVC dev environment so lib.exe can build
      # an ARM64 import library from the committed libmpv.def.
      - name: Set up MSVC (Windows ARM64)
        if: matrix.platform.target == 'aarch64-pc-windows-msvc'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      # Pinned official mpv 0.42.0 builds for the target architecture, verified
      # by archive and file SHA-256 (scripts/lib/mpv-pins.mjs). The ARM64 pair
      # is pinned but not release-tested; x64 files are never reused for ARM64.
      - name: Fetch libmpv and mpv (Windows)
        if: contains(matrix.platform.runner, 'windows')
        shell: pwsh
        run: |
          $env:HARBOR_MPV_ARCH = if ('${{ matrix.platform.target }}' -like 'aarch64*') { 'arm64' } else { 'x64' }
          pnpm run setup:libmpv
          if ($LASTEXITCODE -ne 0) { exit 1 }
          pnpm run setup:mpv
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if ($env:HARBOR_MPV_ARCH -eq 'arm64') {
            lib /def:src-tauri/libmpv/libmpv.def /machine:arm64 /out:src-tauri/libmpv/mpv.lib
          }

      - name: Fetch external binaries
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          cd src-tauri/binaries
          TARGET="${{ matrix.platform.target }}"
          EXT=""
          if [[ "$TARGET" == *"windows"* ]]; then EXT=".exe"; fi

          echo "Downloading yt-dlp..."
          if [[ "$TARGET" == *"windows"* ]]; then
            curl --fail --location --retry 3 --retry-all-errors "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -o "yt-dlp-${TARGET}${EXT}"
          elif [[ "$TARGET" == *"apple"* ]]; then
            curl --fail --location --retry 3 --retry-all-errors "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos" -o "yt-dlp-${TARGET}${EXT}"
          else
            curl --fail --location --retry 3 --retry-all-errors "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp" -o "yt-dlp-${TARGET}${EXT}"
          fi
          chmod +x "yt-dlp-${TARGET}${EXT}" || true

          echo "Fetching ffmpeg and ffprobe..."
          if [[ "$TARGET" == *"windows"* ]]; then
            if [[ "$TARGET" == *"aarch64"* ]]; then FFARCH="winarm64"; else FFARCH="win64"; fi
            curl --fail --location --retry 3 --retry-all-errors "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-${FFARCH}-gpl.zip" -o ffmpeg.zip
            unzip -j ffmpeg.zip "*/bin/ffmpeg.exe" "*/bin/ffprobe.exe"
            mv ffmpeg.exe "ffmpeg-${TARGET}${EXT}"
            mv ffprobe.exe "ffprobe-${TARGET}${EXT}"
          elif [[ "$TARGET" == *"apple"* ]]; then
            # Pinned, hash-verified native FFmpeg 9.0.2 builds (see
            # scripts/fetch-binaries.mjs); the runner's arch matches the target.
            (cd ../.. && node scripts/fetch-binaries.mjs)
          else
            curl --fail --location --retry 3 --retry-all-errors "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz" -o ffmpeg.tar.xz
            tar -xf ffmpeg.tar.xz --strip-components=1 --wildcards '*/ffmpeg' '*/ffprobe'
            mv ffmpeg "ffmpeg-${TARGET}${EXT}"
            mv ffprobe "ffprobe-${TARGET}${EXT}"
          fi

      - name: harbor-core check
        working-directory: harbor-core
        run: |
          cargo check
          cargo test --all-targets

      - name: Tauri build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        with:
          tauriScript: pnpm tauri
          args: --target ${{ matrix.platform.target }}

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: harbor-${{ matrix.platform.name }}
          path: |
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/**/*.exe
          retention-days: 14
          if-no-files-found: error
