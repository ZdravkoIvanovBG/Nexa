name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            harbor-core
            src-tauri

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify version matches tag
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          CARGO_VERSION=$(node -p "require('fs').readFileSync('src-tauri/Cargo.toml','utf8').match(/^\[package\][\s\S]*?^version\s*=\s*\"([^\"]+)\"/m)[1]")
          TAURI_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")

          echo "Tag version:     $TAG_VERSION"
          echo "package.json:    $PKG_VERSION"
          echo "Cargo.toml:      $CARGO_VERSION"
          echo "tauri.conf.json: $TAURI_VERSION"

          if [ "$TAURI_VERSION" != "../package.json" ]; then
            echo "::error::tauri.conf.json \"version\" must be \"../package.json\" so the bundle and the published latest.json always follow package.json (found \"$TAURI_VERSION\")"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION -- bump package.json before tagging"
            exit 1
          fi
          if [ "$CARGO_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::src-tauri/Cargo.toml version $CARGO_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Fetch libmpv (Windows x64)
        run: pnpm run setup:libmpv

      - name: Fetch mpv (Windows x64)
        run: pnpm run setup:mpv

      - name: Fetch external binaries
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          cd src-tauri/binaries
          TARGET="x86_64-pc-windows-msvc"

          echo "Downloading yt-dlp..."
          curl --fail --location --retry 3 --retry-all-errors "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -o "yt-dlp-${TARGET}.exe"

          echo "Fetching ffmpeg and ffprobe..."
          curl --fail --location --retry 3 --retry-all-errors "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -o ffmpeg.zip
          unzip -j ffmpeg.zip "*/bin/ffmpeg.exe" "*/bin/ffprobe.exe"
          mv ffmpeg.exe "ffmpeg-${TARGET}.exe"
          mv ffprobe.exe "ffprobe-${TARGET}.exe"

      - name: harbor-core check
        working-directory: harbor-core
        run: |
          cargo check
          cargo test --all-targets

      - name: Build, sign, and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        with:
          tauriScript: pnpm tauri
          tagName: ${{ github.ref_name }}
          releaseName: "Harbor ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install this version."
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --target x86_64-pc-windows-msvc

      - name: Verify updater manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -f latest.json
          gh release download "$GITHUB_REF_NAME" -p latest.json --repo "$GITHUB_REPOSITORY" --clobber

          TAG_VERSION="${GITHUB_REF_NAME#v}" node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('latest.json', 'utf8'));
            const tagVersion = process.env.TAG_VERSION;
            const repo = process.env.GITHUB_REPOSITORY;
            const refName = process.env.GITHUB_REF_NAME;

            if (manifest.version !== tagVersion) {
              console.error(\`latest.json version \${manifest.version} does not match tag version \${tagVersion}\`);
              process.exit(1);
            }
            const platform = manifest.platforms && manifest.platforms['windows-x86_64'];
            if (!platform || !platform.signature) {
              console.error('latest.json is missing a windows-x86_64 signature');
              process.exit(1);
            }
            const expectedPrefix = \`https://github.com/\${repo}/releases/download/\${refName}/\`;
            if (!platform.url || !platform.url.startsWith(expectedPrefix) || !platform.url.endsWith('.exe')) {
              console.error(\`latest.json windows-x86_64 url is unexpected: \${platform.url}\`);
              process.exit(1);
            }
            console.log('latest.json looks correct:', JSON.stringify({ version: manifest.version, url: platform.url }, null, 2));
          "
